name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev liblzma-dev libbz2-dev

      - name: Install p4a toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 钉住版本：2026.5.9 的 android recipe 会去 PyPI 找不存在的 'android' 包，
          # 2023.9.16 是社区验证充分的组合（默认 Python 3.11）。
          python -m pip install "cython<3" "python-for-android==2023.9.16"

      - name: Install Android SDK platform 31
        run: |
          # runner 自带 34/35/36，没有 31；p4a 2023.9.16 默认目标就是 31
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-31" "build-tools;31.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Install NDK 25b
        run: |
          # runner 自带 NDK 27，其移除了 ALooper_pollAll，SDL2 老版本会编译失败。
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;25.2.9519653" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/ndk"

      - name: Cache Android SDK / NDK / downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/python-for-android
            ~/.android
          key: p4a-${{ runner.os }}-2023.9.16-v1
          restore-keys: |
            p4a-${{ runner.os }}-2023.9.16-

      - name: Build debug APK
        env:
          ANDROID_API: 31
        run: |
          set -o pipefail     # 否则 p4a 失败时 tee 返回 0，step 会误报成功
          cd android
          p4a apk \
            --private . \
            --package org.aimedia.aimedia \
            --name "AI多模态控制台" \
            --version 1.0.2 \
            --requirements "python3,kivy,requests,urllib3,certifi,idna,charset-normalizer,pyjnius" \
            --android-api 34 \
            --minsdk 24 \
            --allow-minsdk-ndkapi-mismatch \
            --arch arm64-v8a \
            --bootstrap sdl2 \
            --ndk-dir "$ANDROID_HOME/ndk/25.2.9519653" \
            --sdk-dir "$ANDROID_HOME" \
            --permission INTERNET \
            --debug 2>&1 | tee /tmp/p4a-build.log

      - name: Show build log tail on failure
        if: failure()
        run: tail -80 /tmp/p4a-build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimedia-debug-apk
          path: |
            **/*.apk
            /tmp/p4a-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "## APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh $(find . -name "*.apk" | head -5) >> $GITHUB_STEP_SUMMARY
