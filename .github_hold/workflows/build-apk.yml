name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev liblzma-dev libbz2-dev

      - name: Install p4a toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 钉住版本：2026.5.9 的 android recipe 会去 PyPI 找不存在的 'android' 包，
          # 2023.9.16 是社区验证充分的组合（默认 Python 3.11）。
          python -m pip install "cython<3" "python-for-android==2023.9.16"

      - name: Cache Android SDK / NDK / downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/python-for-android
            ~/.android
          key: p4a-${{ runner.os }}-2023.9.16-v1
          restore-keys: |
            p4a-${{ runner.os }}-2023.9.16-

      - name: Build debug APK
        env:
          ANDROID_API: 31
        run: |
          cd android
          p4a apk \
            --private . \
            --package org.aimedia.aimedia \
            --name "AI多模态控制台" \
            --version 1.0.0 \
            --requirements "python3,kivy,requests,urllib3,certifi,idna,charset-normalizer,pyjnius" \
            --android-api 31 \
            --min-api 24 \
            --arch arm64-v8a \
            --permission INTERNET \
            --permission MANAGE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_MEDIA_IMAGES \
            --permission READ_MEDIA_VIDEO \
            --debug 2>&1 | tee /tmp/p4a-build.log

      - name: Show build log tail on failure
        if: failure()
        run: tail -80 /tmp/p4a-build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimedia-debug-apk
          path: |
            **/*.apk
            /tmp/p4a-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "## APK 构建完成" >> $GITHUB_STEP_SUMMARY
          ls -lh $(find . -name "*.apk" | head -5) >> $GITHUB_STEP_SUMMARY
